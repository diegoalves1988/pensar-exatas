name: Google authentication checks
on:
  push:
    paths:
      - 'shared/googleAuth.ts'
      - 'api/index.ts'
      - 'server/googleAuth.test.ts'
      - '.github/workflows/google-auth.yml'
  pull_request:
    paths:
      - 'shared/googleAuth.ts'
      - 'api/index.ts'
      - 'server/googleAuth.test.ts'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/googleAuth.test.ts
